[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-core"
version = "0.1.0dev"
description = "The torch-free semantic engine for mlopt: term IR, e-graph, laws, cost algebra."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The minted-record store ships inside the package: `laws/data/minted.db`
# is the bank, read at import (see `mlopt_core.laws.store`).
mlopt_core = ["laws/data/*.db"]
