[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-orchestrator"
version = "0.1.0dev"
description = "Backend-neutral optimizer orchestrator for mlopt: pipeline verbs, strategies, regime frontier."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mlopt-core"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The shipped portable law set for `engine="eqsat"` — the
# LAW_FORMAT=2 snapshot of engine-eqsat/laws/*.json minus the unsound
# reshape_flatten_demo record (see `mlopt_orchestrator.eqsat`).
mlopt_orchestrator = ["data/*.json"]
